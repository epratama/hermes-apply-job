<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cover Letter</title>
<style>
@page { size: letter; margin: 2cm 2.2cm; }

*, *::after, *::before { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Calibri', 'Helvetica Neue', 'Arial', sans-serif;
  font-size: 11pt;
  line-height: 1.6;
  color: #1a1a1a;
}

/* {{DESIGN_CSS}} */

h1 { font-size: 14pt; text-align: right; margin-bottom: 1em; }
p { margin: 0.4em 0; }
.date { margin-bottom: 1.5em; }
.body { margin-top: 1.5em; }
.closing { margin-top: 1.5em; }

@media print {
  body { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  @page { margin: 2cm 2.2cm; }
}
</style>
</head>
<body>

<div class="date">{{DATE}}</div>

<h1>{{NAME}}</h1>

<div class="body">
{{CONTENT}}
</div>

<div class="closing">
<p>Sincerely,</p>
<p>{{NAME}}</p>
</div>

</body>
</html>
